services:
  postgres:
    image: postgres:16-alpine
    container_name: ${DB_HOST:-tupoli_db}
    hostname: ${DB_HOST:-tupoli_db}
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-tupoli_db}
      POSTGRES_USER: ${DB_USER:-tupoli_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tupoli_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      tupoli_prod_network:
        aliases:
          - ${DB_HOST:-tupoli_db}
          - postgres
          - tupoli_postgres_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tupoli_user} -d ${DB_NAME:-tupoli_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tupoli_api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      # Dentro de la red interna de Docker, la API debe conectarse directamente al host del contenedor PostgreSQL (tupoli_db:5432)
      DATABASE_URL: postgresql://${DB_USER:-tupoli_user}:${DB_PASSWORD:-tupoli_password}@${DB_HOST:-tupoli_db}:5432/${DB_NAME:-tupoli_db}?schema=public
      DIRECT_URL: postgresql://${DB_USER:-tupoli_user}:${DB_PASSWORD:-tupoli_password}@${DB_HOST:-tupoli_db}:5432/${DB_NAME:-tupoli_db}?schema=public
      RUN_SEEDS: ${RUN_SEEDS:-true}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tupoli_prod_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  tupoli_prod_network:
    driver: bridge
