services:
  mysql:
    image: mysql:8.0
    container_name: ${DB_HOST:-tupoli_db}
    hostname: ${DB_HOST:-tupoli_db}
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-tupoli_root_secret}
      MYSQL_DATABASE: ${DB_NAME:-tupoli_db}
      MYSQL_USER: ${DB_USER:-tupoli_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tupoli_password}
    ports:
      - "${DB_PORT:-33306}:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      tupoli_prod_network:
        aliases:
          - ${DB_HOST:-tupoli_db}
          - mysql
          - tupoli_mysql_prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-tupoli_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tupoli_api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      # Si DATABASE_URL viene definido en .env se usa directamente; de lo contrario apunta a DB_HOST
      DATABASE_URL: ${DATABASE_URL:-mysql://${DB_USER:-tupoli_user}:${DB_PASSWORD:-tupoli_password}@${DB_HOST:-tupoli_db}:3306/${DB_NAME:-tupoli_db}}
      RUN_SEEDS: ${RUN_SEEDS:-true}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tupoli_prod_network

volumes:
  mysql_prod_data:
    driver: local

networks:
  tupoli_prod_network:
    driver: bridge
