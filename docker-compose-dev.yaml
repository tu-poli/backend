services:
  mysql:
    image: mysql:8.0
    container_name: tupoli_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-tupoli_root_secret}
      MYSQL_DATABASE: ${DB_NAME:-tupoli_db}
      MYSQL_USER: ${DB_USER:-tupoli_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tupoli_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - tupoli_dev_network

volumes:
  mysql_dev_data:
    driver: local

networks:
  tupoli_dev_network:
    driver: bridge
