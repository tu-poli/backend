services:
  postgres:
    image: postgres:16-alpine
    container_name: ${DB_HOST:-tupoli_db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tupoli_db}
      POSTGRES_USER: ${DB_USER:-tupoli_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tupoli_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Scripts en este directorio se ejecutan automáticamente al crear el contenedor por primera vez
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - tupoli_dev_network

volumes:
  postgres_dev_data:
    driver: local

networks:
  tupoli_dev_network:
    driver: bridge
